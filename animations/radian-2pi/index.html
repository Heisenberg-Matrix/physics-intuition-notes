<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>谁规定一圈必须是 360°？</title>
  <style>
    :root {
      --bg: #f5f0e6;
      --ink: #30343b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
    }
    video {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: calc(100vh - 96px);
      border-radius: 6px;
      background: var(--bg);
      box-shadow: 0 12px 40px rgba(48, 52, 59, 0.12);
    }
    p {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.04em;
      opacity: 0.6;
    }
    a { color: inherit; }
  </style>
</head>
<body>
  <video
    src="radian-2pi.mp4"
    poster="poster.jpg"
    controls
    loop
    playsinline
    preload="metadata"
    aria-label="一圈为什么是 360 度？把一整圈重新分成 4 份、2π 份，再用半径当软尺量弧长，说明弧度制让同一个数字既能记录旋转，又能直接算出弧长，中文配音竖屏动画"
  ></video>
  <p>中文解说 · 一圈是几份，本来就是我们定的 · 选 2π，弧长直接写成 s = rθ · <a href="radian-2pi.mp4">下载 MP4</a></p>
</body>
</html>
