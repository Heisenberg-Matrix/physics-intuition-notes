<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efe7d7" />
    <title>一个球 — Sphere</title>
    <meta
      name="description"
      content="一个具有手作质感的三维球体，在柔和自然光下可以从任意方向观察。"
    />
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.min.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <main class="app">
      <div
        id="viewport"
        class="viewport"
        role="img"
        aria-label="被柔和光线照亮的手作质感球体，可拖动旋转"
      ></div>

      <header class="hud">
        <p class="kicker">几何小品 · 01</p>
        <h1>一个球</h1>
        <p class="intro">转动它，从任意方向看。<br />没有正面，也没有背面。</p>
      </header>

      <div class="toolbar" role="group" aria-label="视图控制">
        <button id="rotate-toggle" type="button" aria-pressed="true">
          <span class="dot" aria-hidden="true"></span>
          自动旋转
        </button>
        <button id="reset-view" type="button">重置视角</button>
      </div>

      <p class="hint">拖动旋转 · 滚轮缩放</p>

      <noscript>
        <p class="fallback">这个演示需要启用 JavaScript 才能运行。</p>
      </noscript>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
