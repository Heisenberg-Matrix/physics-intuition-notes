  <video
    src="orbit-speed-period.mp4"

    loop
    playsinline
    preload="metadata"

  ></video>
  <p>中文解说 · 从 a = GM/r² 和 a = v²/r 推出 v = √(GM/r) · <a href="orbit-speed-period.mp4">下载 MP4</a></p>
